name: Skill and crop checks
on:
  push:
    branches:
      - main
      - codex/native-image-ui-handoff
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  crop-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install Pillow PyYAML
      - name: Verify syntax and configuration
        run: |
          python -m compileall -q scripts tests
          python -c 'import json, yaml; from pathlib import Path; cfg=json.loads(Path("runtime.local.json").read_text()); assert cfg["provider"] == "chatgpt-native"; assert cfg["api_key_required"] is False; yaml.safe_load(Path("agents/openai.yaml").read_text())'
      - name: Verify crop behavior
        run: python -m unittest discover -s tests -v
